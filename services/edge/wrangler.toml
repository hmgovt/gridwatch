# everybody Hz server. Deploy: pnpm --filter @gridwatch/edge deploy
# Setup and secrets: docs/DEPLOY.md
name = "everybodyhz"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[triggers]
# Every minute: NESO's warnings are checked within a minute of publication.
crons = ["* * * * *"]

[vars]
# The public site that share links and posts point to.
SITE_URL = "https://everybodyhz.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "everybodyhz"
# Created in Western Europe (weur); schema from migrations/0001_init.sql.
database_id = "7a72ca4a-2ce0-4b92-b567-f66495e53d59"
migrations_dir = "migrations"

# Optional raw feed archive. Create with `wrangler r2 bucket create everybodyhz-archive`,
# then uncomment. Use an EU jurisdiction bucket to keep data in Europe.
# [[r2_buckets]]
# binding = "ARCHIVE"
# bucket_name = "everybodyhz-archive"

[observability]
enabled = true
