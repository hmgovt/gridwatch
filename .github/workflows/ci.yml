name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # TODO: pin actions to full commit SHAs (Dependabot keeps them updated).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: corepack enable
      - name: Install (lockfile only, no dependency scripts)
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  android:
    # The test APK, signed with the public test key (apps/web/android/test-signing).
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Enable pnpm
        run: corepack enable
      - name: Install (lockfile only, no dependency scripts)
        run: pnpm install --frozen-lockfile
      - name: Build the APK and run the Android unit tests
        run: pnpm android:apk
      - uses: actions/upload-artifact@v4
        with:
          name: everybody-hz-test-apk
          path: apps/web/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
